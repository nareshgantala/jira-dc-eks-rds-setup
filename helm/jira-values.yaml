# jira-values.yaml
# Official Atlassian Jira Data Center Helm Chart Values
# Note: Initial setup should start with replicaCount: 1 until the first-time setup wizard completes in the browser.

replicaCount: 1

jira:
  service:
    type: ClusterIP
    port: 80

  resources:
    container:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "3"
        memory: "8Gi"
    jvm:
      minHeap: "2g"
      maxHeap: "4g"

# REQUIRED - Database configuration pointing to Aurora Serverless v2 PostgreSQL
database:
  type: postgres72
  url: "jdbc:postgresql://jira-dc-rds-cluster.cluster-c4jq64qge0zg.us-east-1.rds.amazonaws.com:5432/jiradb"
  driver: org.postgresql.Driver
  credentials:
    secretName: jira-db-secret
    usernameSecretKey: username
    passwordSecretKey: password

# REQUIRED - Volume Configuration
volumes:
  localHome:
    persistentVolumeClaim:
      create: true
      storageClassName: "gp2"
      resources:
        requests:
          storage: 50Gi

  sharedHome:
    persistentVolumeClaim:
      create: true
      storageClassName: "efs-sc"
      resources:
        requests:
          storage: 100Gi

# Ingress: Triggers AWS Load Balancer Controller to provision an internet-facing ALB
ingress:
  create: true
  className: "alb"
  https: false
  host: "k8s-jira-jira-2521efea0a-496804775.us-east-1.elb.amazonaws.com"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /status
    alb.ingress.kubernetes.io/success-codes: "200,302"
    # Sticky Sessions (Mandatory for Jira Data Center clustering)
    alb.ingress.kubernetes.io/affinity: cookie
    alb.ingress.kubernetes.io/affinity-mode: persistent
    alb.ingress.kubernetes.io/session-cookie-name: AWSALB
    alb.ingress.kubernetes.io/session-cookie-expires: "86400"
  path: "/"
